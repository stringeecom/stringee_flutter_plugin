name: stringee_plugin
description: A Flutter plugin for Stringee voice and video calls, chat, live chat, and video conferencing on Android and iOS.
version: 1.3.2
homepage: https://stringee.com
repository: https://github.com/stringeecom/stringee_flutter_plugin
issue_tracker: https://github.com/stringeecom/stringee_flutter_plugin/issues
topics:
  - stringee
  - voip
  - video-call
  - chat
  - webrtc

environment:
  sdk: ">=2.12.0 <4.0.0"
  flutter: ">=2.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.stringee.stringeeflutterplugin
        pluginClass: StringeeFlutterPlugin
      ios:
        pluginClass: StringeeFlutterPlugin
